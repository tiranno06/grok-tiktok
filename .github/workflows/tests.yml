name: Tests

on:
  push:
    paths: ["robot/**", "tests/**", "docs/index.html", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrouver ffmpeg déjà téléchargé
        id: cache-ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: ~/paquets-ffmpeg
          key: ffmpeg-ubuntu-24.04-v1
      - name: Installer ffmpeg
        timeout-minutes: 25
        run: bash outils/installer_ffmpeg.sh
      - name: Garder ffmpeg pour les prochaines fois
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/paquets-ffmpeg
          key: ffmpeg-ubuntu-24.04-v1
      - name: Tests (sans aucun appel payant)
        run: python -m unittest discover -s tests -v
