name: Robot vidéo

on:
  schedule:
    - cron: "17 4,7,10 * * *"    # vers 5 h-6 h, 8 h-9 h et 11 h-12 h à Paris : le 2e et le 3e réveil rattrapent un réveil sauté ou raté
  workflow_dispatch:             # bouton « Créer » du site, ou Actions → Robot vidéo → Run workflow
    inputs:
      format:
        description: "auto (selon le planning), courte, longue ou tiktok"
        default: "auto"
      lien:
        description: "Format tiktok : lien d'une vidéo TikTok, ou vide = au hasard des profils"
        default: ""
      idee:
        description: "Idée imposée (facultatif)"
        default: ""
      remplace:
        description: "Identifiant de la vidéo à remplacer (bouton Refaire du site)"
        default: ""
      simulation:
        description: "1 = test gratuit (fausse vidéo, aucune IA appelée)"
        default: "0"

permissions:
  contents: write                # enregistrer les données et créer les Releases

concurrency:
  group: fabrication             # une seule vidéo fabriquée à la fois (le budget reste juste)
  cancel-in-progress: false

jobs:
  fabriquer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FORMAT: ${{ inputs.format || 'auto' }}
      IDEE: ${{ inputs.idee }}
      REMPLACE: ${{ inputs.remplace }}
      LIEN: ${{ inputs.lien }}
      SIMULATION: ${{ inputs.simulation || '0' }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrouver ffmpeg déjà téléchargé
        id: cache-ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: ~/paquets-ffmpeg
          key: ffmpeg-ubuntu-24.04-v1
      - name: Installer ffmpeg
        timeout-minutes: 25
        run: bash outils/installer_ffmpeg.sh
      - name: Garder ffmpeg pour les prochaines fois
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/paquets-ffmpeg
          key: ffmpeg-ubuntu-24.04-v1
      - name: Installer yt-dlp (vidéos TikTok)
        run: pip install -q "yt-dlp[default,curl-cffi]" || pip install -q yt-dlp
      - name: Fabriquer
        run: python -m robot.principal --format "$FORMAT" --idee "$IDEE" --remplace "$REMPLACE" --lien "$LIEN"
